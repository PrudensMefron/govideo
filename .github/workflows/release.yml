name: CI and draft release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        name: Resolve build version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag ${GITHUB_REF_NAME} is not valid SemVer" >&2
              exit 1
            fi
          else
            version="0.0.0-dev"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  test:
    name: Tests
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Test Go packages
        run: go test -race ./...

  build:
    name: Build ${{ matrix.platform }} amd64
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            filename: govideo-linux-amd64
          - platform: windows
            runner: windows-2025
            filename: govideo-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20

      - name: Install frontend dependencies with npm
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Build with Wails
        shell: bash
        run: >-
          wails3 build
          GOOS=${{ matrix.platform }}
          ARCH=amd64
          PACKAGE_MANAGER=npm
          VERSION=${{ needs.prepare.outputs.version }}

      - name: Name updater payload
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            mv bin/govideo.exe "bin/${{ matrix.filename }}"
          else
            mv bin/govideo "bin/${{ matrix.filename }}"
            chmod 0755 "bin/${{ matrix.filename }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: bin/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: govideo-*
          path: dist
          merge-multiple: true

      - name: Verify payload set and generate checksums
        shell: bash
        run: |
          test -f dist/govideo-linux-amd64
          test -f dist/govideo-windows-amd64.exe
          chmod 0755 dist/govideo-linux-amd64
          cd dist
          sha256sum govideo-linux-amd64 govideo-windows-amd64.exe > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --json isDraft --jq '.isDraft' >/tmp/release-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft)" != "true" ]]; then
              echo "Release ${tag} already exists and is not a draft" >&2
              exit 1
            fi
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --draft \
              --verify-tag \
              --title "GoVideo ${tag}" \
              --generate-notes
          fi
