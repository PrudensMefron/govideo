name: CI and draft release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Resolve build version
        shell: bash
        run: |
          git fetch --force --tags origin
          latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest}" ]]; then
            major=0
            minor=0
            patch=0
          else
            if [[ ! "${latest}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest tag ${latest} is not a stable SemVer tag" >&2
              exit 1
            fi
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          fi
          patch=$((patch + 1))
          version="${major}.${minor}.${patch}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Next release: v${version} (previous: ${latest:-none})"

  test:
    name: Tests
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Test Go packages
        run: go test -race ./...

  build:
    name: Build ${{ matrix.platform }} amd64
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            filename: govideo-linux-amd64
          - platform: windows
            runner: windows-2025
            filename: govideo-windows-amd64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20

      - name: Install frontend dependencies with npm
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Build with Wails
        shell: bash
        run: >-
          wails3 build
          GOOS=${{ matrix.platform }}
          ARCH=amd64
          PACKAGE_MANAGER=npm
          VERSION=${{ needs.prepare.outputs.version }}

      - name: Name updater payload
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            mv bin/govideo.exe "bin/${{ matrix.filename }}"
          else
            mv bin/govideo "bin/${{ matrix.filename }}"
            chmod 0755 "bin/${{ matrix.filename }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: bin/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  tag-release:
    name: Create release tag
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or verify release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            existing_sha="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
            if [[ "${existing_sha}" != "${MERGE_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to ${existing_sha}, expected ${MERGE_SHA}" >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists at ${MERGE_SHA}"
          else
            git tag -a "${RELEASE_TAG}" "${MERGE_SHA}" -m "Release ${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

  draft-release:
    name: Create draft release
    needs: [prepare, build, tag-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: govideo-*
          path: dist
          merge-multiple: true

      - name: Verify payload set and generate checksums
        shell: bash
        run: |
          test -f dist/govideo-linux-amd64
          test -f dist/govideo-windows-amd64.exe
          chmod 0755 dist/govideo-linux-amd64
          cd dist
          sha256sum govideo-linux-amd64 govideo-windows-amd64.exe > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          if gh release view "${tag}" --json isDraft --jq '.isDraft' >/tmp/release-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft)" != "true" ]]; then
              echo "Release ${tag} already exists and is not a draft" >&2
              exit 1
            fi
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --draft \
              --title "GoVideo ${tag}" \
              --generate-notes
          fi
